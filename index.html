    nota: "solo avisa de operaciones arriba de $1,500 — los gastos chicos no llegan",
    limiteConocido: 150000,
  },
  {
    id: "mercadopago",
    nombre: "Mercado Pago",
    remitentes: [/@mercadopago\.com(\.mx)?$/i, /mercadopago|mercadolibre/i],
    avisa: "todo",
  },
  {
    id: "didi",
    nombre: "DiDi",
    remitentes: [/@didiglobal\.com$/i, /didi/i],
    avisa: "todo",
  },
  {
    id: "spin",
    nombre: "Spin by OXXO",
    remitentes: [/@spin(byoxxo)?\.com(\.mx)?$/i, /spin.?by.?oxxo|oxxo/i],
    avisa: "todo",
  },
  {
    id: "klar",
    nombre: "Klar",
    remitentes: [/@klar\.mx$/i, /klar/i],
    avisa: "todo",
  },
  {
    id: "stori",
    nombre: "Stori",
    remitentes: [/@storicard\.com$/i, /stori/i],
    avisa: "todo",
  },
  {
    id: "hey",
    nombre: "Hey Banco",
    remitentes: [/@hey\.inc$/i, /hey ?banco/i],
    avisa: "todo",
  },
  {
    id: "nu",
    nombre: "Nu",
    remitentes: [/@nu\.com\.mx$/i, /\bnu\b|nubank/i],
    // Corregido con un comprobante real en la mano: Nu SÍ manda correo de las transferencias
    // que envías, con monto, fecha, destinatario y entidad. Lo que no manda es aviso de cada
    // compra con tarjeta: eso vive solo en su app. Antes aquí decía que no mandaba nada, y era
    // falso — la app llegó a afirmarlo en pantalla.
    avisa: "parcial",
    nota: "manda correo de las transferencias que envías, pero no de las compras con tarjeta",
  },
];

/** Qué banco mandó esto. `null` si no lo reconoce — que es un resultado válido, no un error. */
function bancoDeRemitente(remitente) {
  const texto = String(remitente || "").trim();
  if (!texto) return null;
  for (const banco of BANCOS) {
    if (banco.remitentes.some((patron) => patron.test(texto))) return banco;
  }
  return null;
}

/** Los que avisan de todo por correo: con esos el puente cubre solo. */
function bancosQueAvisan() {
  return BANCOS.filter((b) => b.avisa === "todo");
}

/** Los que avisan a medias. Son los que hay que explicar, no esconder. */
function bancosParciales() {
  return BANCOS.filter((b) => b.avisa === "parcial");
}

/** El nombre como se escribe, a partir del id que se guardó. */
function nombreDeBanco(id) {
  const banco = BANCOS.find((b) => b.id === id);
  return banco ? banco.nombre : null;
}

// ═══ motor/campos.js ═══
// Campos — la estructura que comparten todos los avisos, en una tabla en vez de en código.
//
// Investigando por qué se rompen los lectores de avisos bancarios sale siempre la misma
// respuesta: se escriben POR BANCO. Cada banco su rama, cada rama su mantenimiento, y el día
// que uno cambia la plantilla —sin avisar, porque nadie avisa— esa rama deja de servir.
//
// Pero sí hay estructura general, y son dos capas distintas:
//
//   1. Las TRANSFERENCIAS tienen norma formal. El CEP del Banco de México fija los campos de
//      toda operación SPEI: fecha y hora, monto, clave de rastreo, banco emisor, banco
//      receptor, ordenante, beneficiario, concepto y referencia numérica. Por eso Santander
//      escribe "ABONO VÍA SPEI" y Nu manda destinatario, entidad y clave: los dos están
//      contando lo mismo con otras palabras.
//
//   2. Las COMPRAS con tarjeta no tienen norma, pero convergen. Las redes de autorización
//      empujan siempre lo mismo: monto y moneda, comercio, fecha y hora, últimos cuatro,
//      tipo de operación y folio de autorización.
//
// En las dos capas, lo que cambia de un banco a otro son las ETIQUETAS, no los campos. Así
// que esto es una tabla de campo × sinónimos, y los bancos dejan de ser un requisito para ser
// una pista. Agregar un banco es agregar renglones aquí, no escribir código — que es lo que
// convierte cada comprobante que llegue en cobertura permanente.

/** Escapa un sinónimo para meterlo en una expresión regular sin sorpresas. */
function literal(texto) {
  return texto.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

/**
 * Los campos, con sus sinónimos reales y qué forma tiene su valor.
 *
 * `exigeDosPuntos` separa dos clases de etiqueta, y la diferencia ya costó un error medido:
 * las inequívocas ("Establecimiento") pueden venir sin dos puntos porque el banco las manda en
 * una celda y el valor en la de al lado; las genéricas ("Nombre") los EXIGEN, porque si no, el
 * nombre del titular de la cuenta se lee como si fuera el comercio.
 */
const CAMPOS = {
  // La llave de oro. Identifica una operación SPEI de forma única y es LA MISMA vista desde
  // el banco que manda y el que recibe. Con esto, dos avisos de una transferencia dejan de
  // ser dos movimientos sin tener que adivinar por monto y fecha.
  claveRastreo: {
    etiquetas: ["clave de rastreo", "clave rastreo", "clave de seguimiento", "clave de referencia", "tracking key"],
    valor: /[A-Za-z0-9]{6,30}/,
    exigeDigito: true,
    exigeDosPuntos: false,
  },

  // El folio de autorización. Suele viajar igual entre la preautorización y el cargo final,
  // que es justo el par que hoy se cuenta dos veces cuando el monto cambia.
  folio: {
    etiquetas: [
      "folio de autorizaci", "n[úu]mero de autorizaci", "clave de autorizaci", "c[óo]digo de autorizaci",
      "autorizaci[óo]n", "folio",
    ],
    valor: /\d{4,12}/,
    exigeDosPuntos: false,
  },

  // La referencia numérica NO sirve para identificar: dos operaciones distintas pueden
  // llevar la misma. Se lee para poder enseñarla, nunca para decidir si algo está repetido.
  referencia: {
    etiquetas: ["referencia num", "n[úu]mero de referencia", "referencia"],
    valor: /\d{1,20}/,
    exigeDosPuntos: true,
  },

  hora: {
    etiquetas: ["hora", "hora de operaci", "hora de la operaci"],
    valor: /\d{1,2}:\d{2}(?::\d{2})?/,
    exigeDosPuntos: false,
  },

  // Con quién fue la operación. Es el comercio en una compra y la persona o el banco en una
  // transferencia — el mismo hueco del CEP, con distintos nombres según quién lo llene.
  contraparte: {
    // Inequívocas: pueden venir sin dos puntos, en la celda de al lado.
    etiquetas: ["comercio", "establecimiento", "negocio", "beneficiario", "destinatario", "banco\\s+emisor"],
    // Genéricas: exigen dos puntos o se comen el nombre del titular.
    etiquetasDebiles: ["concepto(?:\\s+de\\s+pago)?", "entidad", "nombre", "ordenante"],
    exigeDosPuntos: false,
  },
};

/**
 * Busca un campo por sus etiquetas. Devuelve el valor crudo o `null`.
 *
 * Todos los cuantificadores van con tope. Sin RE2 —y este proyecto no tiene dependencias— la
 * defensa contra una entrada patológica es disciplina más medición, y hay una prueba que
 * falla si leer un texto adversario tarda de más.
 */
function valorEtiquetado(texto, nombreCampo) {
  const campo = CAMPOS[nombreCampo];
  if (!campo || !campo.valor) return null;

  const separador = campo.exigeDosPuntos ? "\\s*[:\\-]\\s*" : "\\s*[:\\-]?\\s*\\n?\\s*";
  const etiquetas = campo.etiquetas.map((e) => (/[\\[\]().*+?]/.test(e) ? e : literal(e))).join("|");
  const patron = new RegExp(`(?:${etiquetas})${separador}(${campo.valor.source})`, "i");

  const encontrado = texto.match(patron);
  if (!encontrado) return null;

  const valor = encontrado[1];
  // Una clave de rastreo sin un solo dígito es una palabra que quedó pegada a la etiqueta.
  if (campo.exigeDigito && !/\d/.test(valor)) return null;
  return valor;
}

/**
 * Todas las etiquetas de contraparte, como las arma el lector.
 *
 * Vive aquí, con las demás, para que sumar un banco sea sumar sinónimos a la tabla. La lógica
 * de qué se hace con lo encontrado se queda en lectura.js, donde está medida.
 */
function patronContraparte() {
  const fuertes = CAMPOS.contraparte.etiquetas.join("|");
  const debiles = CAMPOS.contraparte.etiquetasDebiles.join("|");
  return new RegExp(
    `(?:(?:${fuertes})\\s*[:\\-]?\\s*\\n?\\s*|(?:${debiles})\\s*[:\\-]\\s*)([^\\n|]{2,90})`,
    "gi",
  );
}

// ═══ motor/rapido.js ═══
// Captura rápida — lo que nunca va a llegar por correo.
//
// En México la mitad del gasto no deja rastro digital: los tacos, el OXXO de la esquina, el
// camión, las propinas, la señora de la fruta. El puente no lo va a ver nunca, y si eso no
// entra, los números mienten hacia abajo y la app pierde la autoridad que la hace útil —que
// es la otra forma de morirse, más lenta que perder datos pero igual de definitiva.
//
// La respuesta no es un catálogo de montos inventado por mí. Es SU historial: la gente que
// gasta en efectivo repite cantidades, y esas cantidades son distintas para cada quien. Si
// todavía no hay historial, aquí no se propone nada y aparece el botón de siempre: inventarle
// un "$50 · comida" a alguien que nunca ha gastado eso es la misma clase de mentira que un
// cero disfrazado de dato.



/** Cuánto hacia atrás se mira. Lo de hace medio año ya no dice cómo gastas hoy. */
const DIAS_DE_HISTORIA = 90;

/** Cuántas veces tiene que repetirse un monto para que valga la pena ofrecerlo. */
const REPETICIONES_MINIMAS = 2;

/**
 * Los montos que más repite, con la categoría que más les pone.
 *
 * Devuelve `[]` cuando no hay de dónde sacarlos, que es una respuesta válida y no un vacío
 * que haya que rellenar.
 */
function montosFrecuentes(datos, iso = hoyISO(), cuantos = 3) {
  const desde = sumarDias(iso, -DIAS_DE_HISTORIA);

  const cuenta = new Map();
  for (const lista of Object.values(datos.movimientos || {})) {
    for (const m of lista) {
      if (m.tipo !== TIPOS.GASTO) continue;
      if (comparar(m.fecha, desde) < 0) continue;
      // Los movimientos que nacieron de un fijo no son captura rápida: ya se pagan solos.
      if (m.fijoId) continue;

      const previo = cuenta.get(m.monto) || { monto: m.monto, veces: 0, categorias: new Map(), ultima: "" };
      previo.veces++;
      previo.categorias.set(m.categoria, (previo.categorias.get(m.categoria) || 0) + 1);
      if (comparar(m.fecha, previo.ultima) > 0) previo.ultima = m.fecha;
      cuenta.set(m.monto, previo);
    }
  }

  return [...cuenta.values()]
    .filter((c) => c.veces >= REPETICIONES_MINIMAS)
    // Más repetido primero; a igual repetición, lo más reciente, que es lo que sigue vigente.
    .sort((a, b) => b.veces - a.veces || comparar(b.ultima, a.ultima))
    .slice(0, cuantos)
    .map((c) => ({
      monto: c.monto,
      veces: c.veces,
      categoriaId: categoriaDominante(c.categorias),
    }));
}

function categoriaDominante(categorias) {
  let mejor = null;
  let masVeces = 0;
  for (const [categoriaId, veces] of categorias) {
    if (categoriaId && veces > masVeces) {
      mejor = categoriaId;
      masVeces = veces;
    }
  }
  return mejor;
}

/**
 * La categoría que le tocaría a un gasto de este monto, según lo que ha hecho antes.
 * `null` cuando no hay con qué decidirlo — y entonces se pregunta, no se adivina.
 */
function categoriaProbable(datos, centavos, iso = hoyISO()) {
  const encontrado = montosFrecuentes(datos, iso, 20).find((f) => f.monto === centavos);
  return encontrado ? encontrado.categoriaId : null;
}

// ═══ motor/lectura.js ═══
// Lectura de avisos — convertir el texto de un banco en un movimiento.
//
// Esta es la pieza que hace que la app sirva para alguien sin tiempo. Y es también la más
// peligrosa, porque un aviso mal leído ensucia los números en silencio. Por eso:
//
//   1. NUNCA devuelve un movimiento a medias. Sin monto no hay nada que registrar y se
//      declara `SIN_DATOS_SUFICIENTES`, igual que todo el motor.
//   2. NUNCA guarda el correo. Solo monto, fecha, comercio y los últimos 4 de la tarjeta.
//      El cuerpo del aviso se usa aquí y se tira.
//   3. SIEMPRE dice qué tan seguro está. La confianza es parte de la respuesta, no una
//      nota al pie: es lo que decide si esto se muestra como un hecho o como una pregunta.
//
// Funciona con cualquier banco, reconocido o no. La tabla de reglas-banco.js sube la
// confianza; su ausencia no impide leer.







const CONFIANZAS = { ALTA: "alta", MEDIA: "media", BAJA: "baja" };

/** A cuántos días de hoy deja de ser creíble la fecha de un aviso. */
const DIAS_RAZONABLES = 60;

/** Días que puede tardar una preautorización en liquidarse. Los bancos documentan hasta 5. */
const DIAS_LIQUIDACION = 5;

/** Cuánto puede moverse el monto entre la preautorización y el cargo final. */
const MARGEN_LIQUIDACION = 0.6;

const MESES_ES = {
  ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6,
  jul: 7, ago: 8, sep: 9, set: 9, oct: 10, nov: 11, dic: 12,
};

// Un monto se reconoce por el signo o por la moneda. Pedir una de las dos evita confundir
// un número de referencia de 6 dígitos con dinero.
// Un monto se reconoce por el signo o por la moneda, y la moneda puede ir de los dos lados:
// "$1,234.56", "1,234.56 MXN" y "MXN 1,234.56" son el mismo dinero. Pedir alguna de las dos
// marcas evita confundir un número de referencia de seis dígitos con un importe.
const CIFRA = String.raw`\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?`;
const PATRON_MONTO = new RegExp(
  String.raw`\$\s*(${CIFRA})` +                                   // $1,234.56
  String.raw`|\b(?:MXN|M\.?N\.?)\s*(${CIFRA})\b` +                // MXN 1,234.56
  String.raw`|\b(${CIFRA})\s*(?:MXN|M\.?N\.?|pesos)\b`,           // 1,234.56 MXN
  "gi",
);

// Lo que aparece junto a un monto que NO es el de la operación. Es la regla que más errores
// evita: casi todo aviso bancario trae el saldo, y el saldo no es un gasto.
const CONTEXTO_AJENO = /(saldo|disponible|l[íi]mite|l[íi]nea de cr[ée]dito|puntos|cashback|pago m[íi]nimo|para no generar intereses|meses sin intereses|promoci[óo]n|aprovecha|participantes|felicidades)/i;
const CONTEXTO_PROPIO = /(monto|importe|cargo|compra|total|pago|retiro|abono|dep[óo]sito|transferencia|env[íi]o|cobro|consumo)/i;

const PISTAS_INGRESO = /(recibiste|recibida|recibido|te depositaron|te enviaron|abono(?: v[íi]a spei)?|dep[óo]sito|devoluci[óo]n|reembolso|bonificaci[óo]n|cancelaci[óo]n de cargo|n[óo]mina)/i;
const PISTAS_GASTO = /(compra|cargo|retiro|disposici[óo]n|pagaste|enviaste|se envi[óo]|transferencia (?:enviada|para)|spei enviado|realizaste un pago|domiciliaci[óo]n)/i;
const PISTAS_TRASPASO = /(entre tus cuentas|entre cuentas propias|a tu cuenta|traspaso|cuenta propia)/i;

/**
 * Canoniza el texto ANTES de intentar leerlo.
 *
 * Es el paso que separa un lector frágil de uno robusto, y no es teórico: medido contra
 * formatos reales, sin esto la tarjeta `••••4574` no se extrae Y ADEMÁS se cuela dentro del
 * nombre del comercio; un salto suave de quoted-printable parte el nombre en `"OX="`; y las
 * comillas tipográficas se arrastran hasta el historial. Con una sola pasada, todo lo que
 * viene después lee texto predecible.
 *
 * Es idempotente a propósito: canonizar dos veces da lo mismo que canonizar una.
 */
function canonizar(entrada) {
  return String(entrada || "")
    // Quoted-printable: el salto suave parte palabras a los 76 caracteres.
    .replace(/=\r?\n/g, "")
    .replace(/=([0-9A-F]{2})/gi, (crudo, hex) => {
      const codigo = parseInt(hex, 16);
      return codigo >= 32 && codigo < 127 ? String.fromCharCode(codigo) : crudo;
    })
    // Caracteres invisibles que algunos correos meten entre letras.
    .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, "")
    // Espacios que no son el espacio normal.
    .replace(/[\u00A0\u2007\u202F\u2009\u2002-\u2006]/g, " ")
    // Comillas y rayas tipográficas: se van al historial si no se normalizan.
    .replace(/[\u2018\u2019\u201A\u2032]/g, "'")
    .replace(/[\u201C\u201D\u201E\u2033]/g, '"')
    .replace(/[\u2010-\u2015\u2212]/g, "-")
    // Enmascarado de tarjetas: cada banco usa su propia viñeta.
    .replace(/[\u2022\u00B7\u25CF\u2219\u2043\u2027]/g, "*");
}

/** Quita el HTML y deja texto plano. Los avisos de banco llegan casi siempre en HTML. */
function limpiarAviso(entrada) {
  return canonizar(entrada)
    .replace(/<(style|script|head)[\s\S]*?<\/\1>/gi, " ")
    .replace(/<br\s*\/?>|<\/(p|div|tr|td|li|h\d)>/gi, "\n")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;?/gi, " ")
    .replace(/&amp;?/gi, "&")
    .replace(/&(lt|gt|quot|#39|apos);?/gi, " ")
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(Number(n)))
    .replace(/[ \t ]+/g, " ")
    .replace(/\n{2,}/g, "\n")
    .trim();
}

/**
 * El monto de la operación. Devuelve `{ centavos, seguro }`.
 * `seguro` es false cuando el número existe pero nadie dijo de qué era: se lee, pero baja
 * la confianza en vez de fingir certeza.
 */
/** A cuántos caracteres del monto queda la palabra más cercana que empate con `patron`. */
function distanciaA(patron, antes, despues) {
  const atras = [...antes.matchAll(new RegExp(patron.source, "gi"))].pop();
  const adelante = despues.match(new RegExp(patron.source, "i"));
  return Math.min(
    atras ? antes.length - (atras.index + atras[0].length) : Infinity,
    adelante ? adelante.index : Infinity,
  );
}

function montoDelAviso(texto) {
  const candidatos = [];
  PATRON_MONTO.lastIndex = 0;
  let hallazgo;
  while ((hallazgo = PATRON_MONTO.exec(texto))) {
    const centavos = aCentavos(hallazgo[1] || hallazgo[2] || hallazgo[3]);
    if (centavos === null || centavos === 0) continue;
    // Gana la palabra MÁS CERCANA, no cualquiera de la ventana. En "Cargo por $89.00 en OXXO.
    // Saldo disponible: $8,000" las dos palabras rodean al mismo número: mirar si existe un
    // "saldo" por ahí descartaba el cargo de verdad.
    const antes = texto.slice(Math.max(0, hallazgo.index - 60), hallazgo.index);
    const despues = texto.slice(hallazgo.index + hallazgo[0].length, hallazgo.index + hallazgo[0].length + 25);
    const aAjeno = distanciaA(CONTEXTO_AJENO, antes, despues);
    const aPropio = distanciaA(CONTEXTO_PROPIO, antes, despues);
    candidatos.push({ centavos, ajeno: aAjeno < aPropio, propio: aPropio < aAjeno });
  }

  if (!candidatos.length) return { centavos: null, seguro: false, varios: false };

  const noAjeno = candidatos.filter((c) => !c.ajeno);
  // Un estado de cuenta trae varias operaciones y aquí solo cabe una. No se inventa nada:
  // se lee la primera y se dice que había más, para que la persona revise el correo.
  const varios = new Set(noAjeno.map((c) => c.centavos)).size > 1;

  const nombrado = candidatos.find((c) => c.propio && !c.ajeno);
  if (nombrado) return { centavos: nombrado.centavos, seguro: true, varios };

  if (noAjeno.length === 1) return { centavos: noAjeno[0].centavos, seguro: true, varios };
  if (noAjeno.length) return { centavos: noAjeno[0].centavos, seguro: false, varios };

  // Todos los montos eran saldos, límites o promociones. Eso no es una operación: es un
  // aviso informativo. Antes se colaba como un gasto de confianza baja y ensuciaba la
  // bandeja con cosas que nadie compró.
  return { centavos: null, seguro: false, soloAjenos: true };
}

function fechaValida(anio, mes, dia) {
  if (mes < 1 || mes > 12) return null;
  if (dia < 1 || dia > diasEnMes(anio, mes)) return null;
  return armarISO(anio, mes, dia);
}

function anioCompleto(crudo, hoy) {
  const n = Number(crudo);
  if (crudo.length === 4) return n;
  return n + (n > 70 ? 1900 : 2000);
}

/**
 * La fecha de la operación. Devuelve `{ iso, explicita }`.
 * Si no la encuentra usa hoy y lo dice: una fecha inventada que se presenta como leída es
 * la clase de mentira que descuadra un ciclo entero.
 */
function fechaDelAviso(texto, hoy = hoyISO()) {
  const iso = texto.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if (iso) {
    const f = fechaValida(Number(iso[1]), Number(iso[2]), Number(iso[3]));
    if (f) return { iso: f, explicita: true };
  }

  // Se recorren TODOS los candidatos, no solo el primero. Medido contra correos reales, el
  // primer candidato suele ser la propia etiqueta —"07... Fecha"— y la fecha buena es la
  // siguiente. Rendirse con el primero mandaba el gasto a la quincena equivocada.
  for (const c of texto.matchAll(/\b(\d{1,2})\s*(?:de\s+)?[\/\- ]?\s*([a-záéíóúñ]{3,10})\.?\s*(?:de\s+)?[\/\- ]?\s*(\d{2,4})?\b/gi)) {
    const mes = MESES_ES[c[2].slice(0, 3).toLowerCase()];
    if (!mes) continue;
    const anio = c[3] ? anioCompleto(c[3], hoy) : Number(hoy.slice(0, 4));
    const f = fechaValida(anio, mes, Number(c[1]));
    if (f) return { iso: f, explicita: true };
  }

  // En México el orden es día/mes/año. Asumir el orden gringo movería gastos de mes.
  for (const c of texto.matchAll(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/g)) {
    const f = fechaValida(anioCompleto(c[3], hoy), Number(c[2]), Number(c[1]));
    if (f) return { iso: f, explicita: true };
  }

  return { iso: hoy, explicita: false };
}

/** Los últimos 4 de la tarjeta. Es lo único de la tarjeta que se guarda, nunca más. */
function tarjetaDelAviso(texto) {
  const m = texto.match(/(?:\*{2,}|x{2,}|terminaci[óo]n(?:\s+en)?|terminada en|final)\s*[:\-]?\s*(\d{3,4})\b/i);
  return m ? m[1] : null; // si el banco enseñó 3 dígitos, se guardan 3: rellenar sería inventar
}

const RUIDO_COMERCIO = /^(el|la|los|las|un|una|tu|su|de|del|en|por|con|monto|importe|cargo|compra|pago|fecha|hora|tarjeta|cuenta|total|mxn|pesos|(?:tu|mi|la|su) (?:cuenta|tarjeta)|la operaci[óo]n|operaci[óo]n|transferencia|dep[óo]sito|movimiento)$/i;

/** El comercio donde se gastó. Sale de las frases que todos los bancos comparten. */
function comercioDelAviso(texto) {
  // Se prueban TODAS las etiquetas, no solo la primera. En el comprobante de Nu, "Concepto:
  // Transferencia" va antes que "Nombre: Persona": quedarse con la primera devolvía una
  // palabra vacía y se perdía el destinatario, que es el dato que sirve.
  //
  // Y los dos puntos son opcionales: Banamex manda la etiqueta en una celda y el valor en la
  // siguiente, y al aplanar el HTML quedan en dos renglones sin ningún separador.
  // Dos clases de etiqueta, y la diferencia importa:
  //   · las inequívocas ("Establecimiento") pueden venir sin dos puntos, en la celda de al lado;
  //   · las genéricas ("Nombre", "Entidad") EXIGEN dos puntos — si no, "NOMBRE APELLIDO" del
  //     titular se leería como si fuera el comercio, y el saludo "Hola, Nombre" también.
  // Las etiquetas viven en motor/campos.js, no aquí: sumar un banco es sumar sinónimos a una
  // tabla de datos, que es lo que evita una rama de código por banco.
  for (const c of texto.matchAll(patronContraparte())) {
    const recortado = recortarComercio(c[1]);
    if (recortado) return recortado;
  }

  // El monto suele meterse entre "compra" y "en", así que hay que saltárselo. Y el nombre
  // termina donde empieza a hablarse de la tarjeta o de la fecha, no en el primer punto:
  // "EL PALACIO DE HIERRO" tiene preposiciones adentro y no hay que cortarlo a la mitad.
  // "compra ... en X", pero también "cargo domiciliado de X" — las suscripciones casi siempre
  // usan "de", y son justo las que alimentan la detección de recurrentes. Y no todo banco dice
  // "compra": hay quien encabeza con "movimiento" o "transacción".
  const conEn = texto.match(
    /(?:compra|cargo|pago|consumo|compraste|pagaste|movimiento|operaci[óo]n|transacci[óo]n|abono|dep[óo]sito)\b[^\n]{0,44}?\b(?:en|de)\s+((?![$\d]|MXN\b|M\.?N\.?\b)[^\n]{2,90}?)(?=\s+(?:con|usando|mediante|tu|su)\b|\s+el\s+\d|\s+a\s+las\b|\s+por\s+\$|[.,;|\n]|$)/i,
  );
  if (conEn) return recortarComercio(conEn[1]);

  return null;
}

function recortarComercio(crudo) {
  const limpio = String(crudo)
    .replace(/\s+/g, " ")
    // El nombre termina donde empieza a hablarse de la tarjeta, aunque no lo haya dicho antes.
    .replace(/\s*(?:terminaci[óo]n|terminada|\*{2,}|x{4,})\b.*$/i, "")
    .replace(/\s+(?:con|el|por|de)\s+(?:tu |su |la |el )?(?:tarjeta|cuenta|monto|importe|fecha|hora|folio|referencia)\b.*$/i, "")
    // La poda de adornos va AL FINAL: quitar la comilla antes deja la de cierre huérfana
    // cuando después se recorta la raya que venía detrás.
    .replace(/[\s.,;:\-]+$/, "")
    .replace(/^["'*\s]+|["'*\s]+$/g, "")
    .trim();
  if (!limpio || RUIDO_COMERCIO.test(limpio)) return null;
  if (!/[a-záéíóúñ]{2}/i.test(limpio)) return null; // referencias y cifras sueltas no son un nombre
  return limpio.slice(0, 60);
}

/**
 * La forma comparable de un comercio: "OXXO GASOLINERA 4412 MEX" → "oxxo gasolinera".
 * Es la llave con la que la app aprende y con la que detecta suscripciones, así que
 * tiene que ser estable entre un cargo y el siguiente del mismo lugar.
 */
function normalizarComercio(nombre) {
  return String(nombre || "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    // Los sufijos legales se quitan ENTEROS y con su puntuación. Si se rompen antes, "S.A.
    // de C.V." se convierte en letras sueltas que se cuelan en el nombre.
    .replace(/\bs\.?\s*a\.?\s*(?:p\.?\s*i\.?\s*)?(?:de\s*)?c\.?\s*v\.?/g, " ")
    .replace(/\bs\.?\s*de\s*r\.?\s*l\.?(?:\s*de\s*c\.?\s*v\.?)?/g, " ")
    .replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\b\d+\b/g, " ")                 // sucursales y referencias cambian, el nombre no
    .replace(/\b(de|del|la|el|mexico|mex|mx|suc|sucursal)\b/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .split(" ").slice(0, 3).join(" ");
}

/**
 * La MARCA, más corta que el nombre normalizado: "starbucks reforma" → "starbucks".
 *
 * Existe porque las dos cosas se necesitan y son distintas:
 *   · para saber si dos avisos son el MISMO cargo hace falta precisión — ahí va el nombre
 *     completo, porque dos compras en sucursales distintas son dos compras;
 *   · para aprender una categoría hace falta lo contrario, generalizar — si corriges el
 *     Starbucks de Reforma, el de Polanco también es comida fuera.
 *
 * Se toma la primera palabra, y dos si la primera es muy corta ("wal mart", "la europea"):
 * una sola letra o sílaba no identifica a nadie.
 */
function marcaDe(comercio) {
  const partes = normalizarComercio(comercio).split(" ").filter(Boolean);
  if (!partes.length) return "";
  return partes[0].length <= 3 && partes[1] ? `${partes[0]} ${partes[1]}` : partes[0];
}

/** Gasto o ingreso. Devuelve `{ tipo, explicito }`. */
function tipoDelAviso(texto) {
  const ingreso = PISTAS_INGRESO.test(texto);
  const gasto = PISTAS_GASTO.test(texto);
  if (ingreso && !gasto) return { tipo: TIPOS.INGRESO, explicito: true };
  if (gasto && !ingreso) return { tipo: TIPOS.GASTO, explicito: true };
  // Ambas o ninguna: la mayoría de los avisos son cobros, pero eso es una suposición.
  return { tipo: TIPOS.GASTO, explicito: false };
}

/**
 * La huella: qué hace que dos avisos sean el MISMO movimiento.
 *
 * Los bancos mandan dos correos por una compra —la autorización y el cargo— y dos por una
 * transferencia entre tus propias cuentas, uno de cada lado. Sin esto, todo eso se contaría
 * dos veces y la app mentiría hacia arriba, que es la peor dirección para mentir.
 *
 * Va en tres niveles, del identificador más fuerte al más débil, porque los avisos TRAEN
 * identificadores y hasta ahora se estaban tirando:
 *
 *   1. La clave de rastreo CON el tipo. Identifica una operación SPEI de forma única y es la
 *      misma desde los dos bancos — por eso hay que llevar el tipo pegado: una transferencia
 *      entre tus propias cuentas manda un aviso de salida y otro de entrada con la MISMA
 *      clave, y colapsarlos dejaría un solo gasto donde en realidad tu dinero no se movió.
 *   2. El folio de autorización con los últimos cuatro. Suele conservarse entre la
 *      preautorización y el cargo final, que es justo el par que cambia de monto: la
 *      gasolinera retiene $100 y cobra $43.
 *   3. Banco, fecha, monto, tarjeta y comercio. Lo de siempre, como red para el aviso que no
 *      trae ningún identificador. Se queda: quitarlo dejaría sin defensa a esos.
 */
function huellaDe({ banco, fecha, monto, ultimos4, comercio, claveRastreo, folio, tipo }) {
  if (claveRastreo) return `rastreo|${String(claveRastreo).toLowerCase()}|${tipo || "?"}`;
  if (folio && ultimos4) return `folio|${folio}|${ultimos4}`;
  return [banco || "?", fecha || "?", monto == null ? "?" : monto, ultimos4 || "?", normalizarComercio(comercio)]
    .join("|");
}

/**
 * Lee un aviso. Nunca lanza: un texto basura devuelve SIN_DATOS_SUFICIENTES con qué falta.
 */
function interpretar(entrada, remitente = "", hoy = hoyISO()) {
  const texto = limpiarAviso(entrada);
  const banco = bancoDeRemitente(remitente) || bancoDeRemitente(texto.slice(0, 200));

  if (!texto) {
    return sinLectura(sinDatos("No hay texto que leer.", "pega el aviso del banco"), banco);
  }

  const { centavos, seguro, varios } = montoDelAviso(texto);
  if (centavos === null) {
    const motivo = montoDelAviso(texto).soloAjenos
      ? "Esto parece un aviso de saldo o una promoción, no un movimiento."
      : "No encontré un monto en este texto.";
    const falta = montoDelAviso(texto).soloAjenos
      ? "si sí fue un cargo, captúralo con el botón +"
      : "revisa que el aviso traiga el importe con $ o MXN";
    return sinLectura(sinDatos(motivo, falta), banco);
  }

  const { iso, explicita } = fechaDelAviso(texto, hoy);
  const comercio = comercioDelAviso(texto);
  const ultimos4 = tarjetaDelAviso(texto);
  const { tipo, explicito } = tipoDelAviso(texto);
  const traspaso = PISTAS_TRASPASO.test(texto);

  // Los identificadores que el aviso ya traía y que hasta ahora se tiraban. No se guardan
  // para enseñarlos: se guardan porque son lo que permite saber que dos avisos son uno.
  const claveRastreo = valorEtiquetado(texto, "claveRastreo");
  const folio = valorEtiquetado(texto, "folio");

  const razones = [];
  const lejos = Math.abs(diasEntre(hoy, iso));
  if (lejos > DIAS_RAZONABLES) {
    razones.push(`la fecha que leí (${iso}) queda a ${lejos} días de hoy — revísala antes de aceptar`);
  }
  if (varios) razones.push("el correo traía más de un cargo y solo leí el primero");
  if (!seguro) razones.push("el monto no venía etiquetado");
  if (!explicita) razones.push("no traía fecha, usé la de hoy");
  if (!explicito) razones.push("no decía si era cargo o abono, lo tomé como gasto");
  if (!comercio) razones.push("no identifiqué el comercio");

  // ALTA significa exactamente una cosa: no quedó nada que revisar. Antes bastaban tres de
  // cuatro señales, así que un aviso sin comercio —o con una fecha absurda— se anunciaba como
  // "lo leí completo" mientras su propio motivo decía "revísalo". Prometer certeza donde
  // faltó un dato es peor que admitir la duda.
  const señales = [seguro, explicita, explicito, Boolean(comercio)].filter(Boolean).length;
  const confianza =
    banco && !razones.length && señales === 4 ? CONFIANZAS.ALTA
      : señales >= 2 ? CONFIANZAS.MEDIA
        : CONFIANZAS.BAJA;

  return {
    movimiento: {
      fecha: iso,
      monto: Math.abs(centavos),
      tipo,
      categoria: tipo === TIPOS.GASTO ? "otros" : null,
      nota: comercio || (banco ? banco.nombre : ""),
      metodo: ultimos4 ? `••${ultimos4}` : null,
      ref: claveRastreo || folio || null,
    },
    banco: banco ? banco.id : null,
    comercio,
    ultimos4,
    claveRastreo,
    folio,
    confianza,
    posibleTraspaso: traspaso,
    huella: huellaDe({
      banco: banco ? banco.id : null, fecha: iso, monto: Math.abs(centavos),
      ultimos4, comercio, claveRastreo, folio, tipo,
    }),
    veredicto: veredicto(
      confianza === CONFIANZAS.ALTA ? ESTADOS.VA_BIEN : ESTADOS.AJUSTADO,
      confianza === CONFIANZAS.ALTA ? SEVERIDADES.OK : SEVERIDADES.INFO,
      razones.length ? `Revísalo: ${razones.join("; ")}.` : "Lo leí completo.",
      { confianza, razones },
    ),
  };
}

function sinLectura(v, banco) {
  return {
    movimiento: null,
    banco: banco ? banco.id : null,
    comercio: null,
    ultimos4: null,
    claveRastreo: null,
    folio: null,
    confianza: CONFIANZAS.BAJA,
    posibleTraspaso: false,
    huella: null,
    veredicto: v,
  };
}

/**
 * ¿Ya conocía esto? Mira la bandeja (misma huella) y lo ya registrado (mismo monto y
 * comercio en ±1 día). Devuelve un veredicto que la pantalla puede mostrar, o null.
 */
function posibleDuplicado(datos, lectura) {
  if (!lectura || !lectura.movimiento || !lectura.huella) return null;

  const enBandeja = (datos.bandeja || []).some((e) => e.huella === lectura.huella && e.estado !== "descartado");
  if (enBandeja) {
    return veredicto(ESTADOS.AJUSTADO, SEVERIDADES.MEDIA, "Este mismo aviso ya está en la bandeja.", {
      motivo: "huella",
    });
  }

  const clave = normalizarComercio(lectura.comercio);
  const { fecha, monto } = lectura.movimiento;
  const ref = lectura.movimiento.ref;

  // Si el aviso trae identificador, no hay nada que adivinar: se busca por él y punto. Esta
  // rama existe porque los avisos SIEMPRE traían estos datos y el lector los estaba tirando,
  // dejando que un parecido de monto y fecha decidiera cosas que un folio decide sin dudar.
  if (ref) {
    for (const lista of Object.values(datos.movimientos || {})) {
      for (const m of lista) {
        if (m.ref !== ref) continue;

        // Misma operación y sentido contrario: es una transferencia entre tus propias
        // cuentas vista desde el otro lado. Tu dinero no se movió, solo cambió de bolsillo.
        if (m.tipo !== lectura.movimiento.tipo) {
          return veredicto(ESTADOS.AJUSTADO, SEVERIDADES.INFO,
            "Es el otro lado de una transferencia entre tus cuentas: tu dinero no cambia de total.",
            { motivo: "traspaso", id: m.id });
        }

        // Mismo folio, mismo sentido, OTRO monto: la preautorización que se liquidó. Con el
        // folio en la mano esto deja de ser una heurística de monto y fecha.
        if (m.monto !== monto) {
          return veredicto(ESTADOS.AJUSTADO, SEVERIDADES.MEDIA,
            `Es el cargo final de ${formatear(m.monto)} que ya tenías${lectura.comercio ? ` de ${lectura.comercio}` : ""}. ` +
            "Reemplázalo en vez de sumar otro.",
            { motivo: "liquidacion", id: m.id, montoPrevio: m.monto, montoNuevo: monto });
        }

        return veredicto(ESTADOS.AJUSTADO, SEVERIDADES.MEDIA,
          "Este movimiento ya está registrado — mismo folio del banco.", { motivo: "huella", id: m.id });
      }
    }
  }

  // Se miran los meses que puedan tocar la ventana, no solo el del día.
  const meses = new Set();
  for (let d = -DIAS_LIQUIDACION; d <= DIAS_LIQUIDACION; d++) meses.add(sumarDias(fecha, d).slice(0, 7));

  let parecido = null;
  for (const mes of meses) {
    for (const m of datos.movimientos[mes] || []) {
      const dias = Math.abs(diasEntre(m.fecha, fecha));
      if (dias > DIAS_LIQUIDACION) continue;
      if (clave && normalizarComercio(m.nota) !== clave) continue;

      // Mismo monto y casi el mismo día: es literalmente el mismo cargo.
      if (m.monto === monto && dias <= 1) {
        return veredicto(ESTADOS.AJUSTADO, SEVERIDADES.MEDIA,
          "Ya tienes un movimiento igual por estos días. ¿Es el mismo cargo?", { motivo: "parecido", id: m.id });
      }

      // Mismo comercio, pocos días, MONTO DISTINTO: el patrón de una preautorización que se
      // liquida. La gasolinera retiene $100 y cobra $43; el restaurante autoriza sin propina y
      // cobra con ella. Antes esto entraba como un segundo gasto y la app mentía hacia arriba.
      if (clave && m.monto !== monto && esLiquidacionDe(m.monto, monto)) {
        parecido = parecido || veredicto(ESTADOS.AJUSTADO, SEVERIDADES.MEDIA,
          `Parece el cargo final de ${formatear(m.monto)} que ya tenías de ${lectura.comercio}. ` +
          `Si lo es, reemplázalo en vez de sumar otro.`,
          { motivo: "liquidacion", id: m.id, montoPrevio: m.monto, montoNuevo: monto });
      }
    }
  }
  return parecido;
}

/**
 * ¿El segundo monto puede ser la liquidación del primero?
 * Se acepta cualquier ajuste dentro de un margen amplio en cualquier dirección: la
 * preautorización puede quedar por encima (gasolinera) o por debajo (propina) del cargo real.
 */
function esLiquidacionDe(previo, nuevo) {
  if (!previo || !nuevo) return false;
  const mayor = Math.max(previo, nuevo);
  const menor = Math.min(previo, nuevo);
  return menor / mayor >= 1 - MARGEN_LIQUIDACION;
}

// ═══ motor/aprendizaje.js ═══
// Aprendizaje — que no tengas que decirle dos veces lo mismo.
//
// Es la diferencia entre las apps que la gente abandona y las que no. La más respetada del
// mundo (YNAB) obliga a categorizar cada movimiento a mano, siempre, incluso los importados;
// hay quien la deja a las tres semanas por eso. Las buenas aprenden de tus correcciones.
//
// Aquí "aprender" no es nada misterioso ni hace falta que lo sea: si corriges OXXO a Súper,
// se guarda una regla, y el siguiente cargo de OXXO ya llega con Súper puesto. Determinista,
// inspeccionable y borrable — que es justo lo que se le pide a algo que toca tu dinero.
//
// Además, antes de que exista una sola regla, ya puede sugerir mirando lo que tú mismo
// capturaste a mano: si tus tres últimos cargos de OXXO fueron Súper, ese es el dato.





/** Cuántos movimientos pasados hay que ver para sugerir sin una regla explícita. */
const MINIMO_PARA_DEDUCIR = 2;

/** La categoría que la persona usó más para este comercio, según su propio historial. */
function categoriaMasUsada(datos, clave) {
  if (!clave) return null;
  const cuenta = new Map();
  for (const lista of Object.values(datos.movimientos || {})) {
    for (const m of lista) {
      if (!m.categoria || marcaDe(m.nota) !== clave) continue;
      cuenta.set(m.categoria, (cuenta.get(m.categoria) || 0) + 1);
    }
  }
  let mejor = null;
  for (const [categoria, veces] of cuenta) {
    if (!mejor || veces > mejor.veces) mejor = { categoria, veces };
  }
  return mejor && mejor.veces >= MINIMO_PARA_DEDUCIR ? mejor : null;
}

/**
 * Qué categoría le toca a este comercio. Devuelve `{ categoriaId, veredicto }` o null.
 * Primero lo que la persona dijo, después lo que la persona hizo. Nunca inventa.
 */
function sugerirCategoria(datos, comercio) {
  const clave = marcaDe(comercio);
  if (!clave) return null;

  const regla = (datos.reglas || []).find((r) => r.clave === clave);
  if (regla) {
    return {
      categoriaId: regla.categoriaId,
      veredicto: veredicto(ESTADOS.VA_BIEN, SEVERIDADES.OK,
        `Ya me habías dicho que ${comercio} va aquí.`, { clave, veces: regla.veces, fuente: "regla" }),
    };
  }

  const deducida = categoriaMasUsada(datos, clave);
  if (deducida) {
    return {
      categoriaId: deducida.categoria,
      veredicto: veredicto(ESTADOS.AJUSTADO, SEVERIDADES.INFO,
        `Tus últimos ${deducida.veces} movimientos de ${comercio} fueron de esta categoría.`,
        { clave, veces: deducida.veces, fuente: "historial" }),
    };
  }

  return null;
}

/**
 * Guarda la corrección. Devuelve datos nuevos; no muta lo recibido.
 * Si la regla ya existía con otra categoría, gana la última: la persona cambió de opinión y
 * la app no está para discutir con ella.
 */
function recordar(datos, comercio, categoriaId, iso = hoyISO()) {
  const clave = marcaDe(comercio);
  if (!clave || !categoriaId) return datos;

  const previas = datos.reglas || [];
  const anterior = previas.find((r) => r.clave === clave);
  const nueva = normalizarRegla({
    clave,
    categoriaId,
    veces: anterior && anterior.categoriaId === categoriaId ? anterior.veces + 1 : 1,
    ultima: iso,
  });

  return { ...datos, reglas: [nueva, ...previas.filter((r) => r.clave !== clave)] };
}

/** Borrar una regla tiene que ser tan fácil como crearla. */
function olvidar(datos, clave) {
  return { ...datos, reglas: (datos.reglas || []).filter((r) => r.clave !== clave) };
}

/** Lo aprendido, para poder mirarlo y corregirlo en Ajustes. */
function reglasAprendidas(datos) {
  return [...(datos.reglas || [])].sort((a, b) => b.veces - a.veces || (a.clave < b.clave ? -1 : 1));
}

// ── Hacia atrás ────────────────────────────────────────────────────────────
//
// Aprender hacia adelante deja media promesa cumplida. Corriges OXXO a Súper y el siguiente
// cargo ya llega bien, pero los veinte de antes se quedan en «Otros» y el presupuesto sigue
// mintiendo hasta que los tocas uno por uno — que es exactamente el trabajo que la app dijo
// que te iba a quitar.
//
// Lo que NO hace: aplicarse sola. Esto reescribe historial, y una app que cambia tus números
// pasados sin decírtelo pierde la autoridad que la hace útil. Se ofrece, con el número por
// delante, y decides tú.

/**
 * Los movimientos pasados de este comercio que la regla cambiaría, del más nuevo al más viejo.
 * Los que ya están en esa categoría no salen: no hay nada que hacerles.
 */
function movimientosDeLaMarca(datos, clave, categoriaId = null) {
  if (!clave) return [];
  const encontrados = [];
  for (const [mes, lista] of Object.entries(datos.movimientos || {})) {
    for (const m of lista) {
      if (marcaDe(m.nota) !== clave) continue;
      if (categoriaId && m.categoria === categoriaId) continue;
      encontrados.push({ ...m, mes });
    }
  }
  return encontrados.sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
}

/**
 * Aplica la regla a lo ya capturado. Devuelve datos nuevos; no muta lo recibido.
 *
 * Solo toca la categoría. El monto, la fecha y la nota son lo que pasó, y eso no se corrige
 * desde aquí ni desde ningún otro lado que no seas tú escribiéndolo.
 */
function aplicarRegla(datos, clave, categoriaId) {
  if (!clave || !categoriaId) return datos;

  const movimientos = {};
  let tocados = 0;
  for (const [mes, lista] of Object.entries(datos.movimientos || {})) {
    movimientos[mes] = lista.map((m) => {
      if (marcaDe(m.nota) !== clave || m.categoria === categoriaId) return m;
      tocados++;
      return { ...m, categoria: categoriaId };
    });
  }

  return tocados ? { ...datos, movimientos } : datos;
}

// ═══ motor/recurrentes.js ═══
// Recurrentes — encontrar las suscripciones que ya estás pagando.
//
// Es el negocio entero de una app que cobra por esto: mirar el historial, ver qué se repite,
// y avisar cuando algo sube de precio. Aquí sale gratis, porque los datos ya están.
//
// Dos cosas hacen que sirva en vez de estorbar:
//   · Se piden TRES cargos antes de llamarle recurrente. Dos son una casualidad.
//   · Si ya lo tienes como pago fijo, no vuelve a proponerlo. Nada peor que una app que
//     insiste en algo que ya resolviste.






const MINIMO_CARGOS = 3;
const TOLERANCIA_DIAS = 8; // un cobro mensual cae en días distintos; eso no lo hace irregular

/**
 * Cuánto puede desviarse un ciclo de N meses y seguir siendo el mismo cobro.
 * Crece poco a propósito: lo mensual baila (meses de 28 a 31 días, fines de semana), pero un
 * cobro semestral cae en la misma fecha del calendario. Si la holgura creciera proporcional,
 * un hueco de 200 días pasaría por "cada 6 meses" y eso ya es inventarse un ritmo.
 */
function toleranciaDe(meses) {
  return Math.min(TOLERANCIA_DIAS + (meses - 1) * 1.5, 18);
}

/** Cada cuánto se repite, en meses, o null si el ritmo no se parece a nada conocido. */
function frecuenciaDeDias(dias) {
  for (const [meses, centro] of [[1, 30], [2, 61], [3, 91], [6, 182], [12, 365]]) {
    if (Math.abs(dias - centro) <= toleranciaDe(meses)) return meses;
  }
  return null;
}

function mediana(numeros) {
  const orden = [...numeros].sort((a, b) => a - b);
  const medio = Math.floor(orden.length / 2);
  return orden.length % 2 ? orden[medio] : Math.round((orden[medio - 1] + orden[medio]) / 2);
}

/** Los gastos agrupados por comercio, cada grupo ordenado de viejo a nuevo. */
function agruparPorComercio(datos) {
  const grupos = new Map();
  for (const lista of Object.values(datos.movimientos || {})) {
    for (const m of lista) {
      if (m.tipo !== TIPOS.GASTO) continue;
      const clave = normalizarComercio(m.nota);
      if (!clave) continue;
      if (!grupos.has(clave)) grupos.set(clave, []);
      grupos.get(clave).push(m);
    }
  }
  for (const lista of grupos.values()) lista.sort((a, b) => comparar(a.fecha, b.fecha));
  return grupos;
}

/**
 * Las suscripciones que se ven en el historial.
 * Devuelve una lista ordenada por lo que más cuesta al mes, que es el orden en que conviene
 * mirarlas cuando quieres recortar.
 */
function detectarRecurrentes(datos, iso = hoyISO()) {
  const yaFijos = new Set((datos.fijos || []).map((f) => normalizarComercio(f.nombre)).filter(Boolean));
  const salida = [];

  for (const [clave, cargos] of agruparPorComercio(datos)) {
    if (cargos.length < MINIMO_CARGOS) continue;

    const huecos = cargos.slice(1).map((m, i) => diasEntre(cargos[i].fecha, m.fecha));
    const tipico = mediana(huecos);
    const frecuencia = frecuenciaDeDias(tipico);
    if (!frecuencia) continue;

    // Un ritmo es un ritmo si casi todos los huecos se parecen entre sí.
    const regulares = huecos.filter((d) => Math.abs(d - tipico) <= toleranciaDe(frecuencia));
    if (regulares.length < huecos.length - 1) continue;

    const ultimo = cargos[cargos.length - 1];
    const anteriores = cargos.slice(0, -1).map((m) => m.monto);
    const montoAnterior = mediana(anteriores);
    const subio = ultimo.monto > montoAnterior;

    salida.push({
      clave,
      nombre: ultimo.nota || clave,
      monto: ultimo.monto,
      montoAnterior: subio ? montoAnterior : null,
      frecuencia,
      mensualizado: Math.round(ultimo.monto / frecuencia),
      veces: cargos.length,
      ultimaFecha: ultimo.fecha,
      proximaFecha: sumarDias(ultimo.fecha, tipico),
      categoria: ultimo.categoria,
      yaEsFijo: yaFijos.has(clave),
      veredicto: subio
        ? veredicto(ESTADOS.NO_ALCANZA, SEVERIDADES.MEDIA,
          `${ultimo.nota || clave} te subió de ${formatear(montoAnterior)} a ${formatear(ultimo.monto)}.`,
          { clave, antes: montoAnterior, ahora: ultimo.monto, sube: ultimo.monto - montoAnterior })
        : veredicto(ESTADOS.VA_BIEN, SEVERIDADES.INFO,
          `Se repite cada ${frecuencia === 1 ? "mes" : `${frecuencia} meses`}: ${cargos.length} cargos de ${formatear(ultimo.monto)}.`,
          { clave, frecuencia, veces: cargos.length }),
    });
  }

  return salida.sort((a, b) => b.mensualizado - a.mensualizado);
}

/** Lo que todavía no está registrado como pago fijo — lo único que vale la pena proponer. */
function porRegistrar(datos, iso = hoyISO()) {
  return detectarRecurrentes(datos, iso).filter((r) => !r.yaEsFijo);
}

/** Las que subieron de precio. Este es el aviso que de verdad ahorra dinero. */
function subieronDePrecio(datos, iso = hoyISO()) {
  return detectarRecurrentes(datos, iso).filter((r) => r.montoAnterior !== null);
}

/** Convierte una recurrente detectada en el pago fijo que ya se sabe manejar. */
function fijoDesdeRecurrente(recurrente) {
  return {
    nombre: recurrente.nombre.slice(0, 80),
    monto: recurrente.monto,
    diaCorte: Number(recurrente.proximaFecha.slice(8, 10)),
    frecuencia: recurrente.frecuencia,
    mesAncla: recurrente.frecuencia === 1 ? null : recurrente.proximaFecha.slice(0, 7),
    categoria: recurrente.categoria || "suscripciones",
    activo: true,
  };
}

/** Cuánto se va al mes en cosas que se repiten. El número que nadie tiene a la mano. */
function totalRecurrenteMensual(datos, iso = hoyISO()) {
  const lista = detectarRecurrentes(datos, iso);
  const total = lista.reduce((t, r) => t + r.mensualizado, 0);
  return {
    total,
    cuantas: lista.length,
    veredicto: lista.length
      ? veredicto(ESTADOS.VA_BIEN, SEVERIDADES.INFO,
        `${lista.length} ${lista.length === 1 ? "cosa se repite y suma" : "cosas se repiten y suman"} ${formatear(total)} al mes.`, { total, cuantas: lista.length })
      : veredicto(ESTADOS.SIN_DATOS, SEVERIDADES.INFO,
        "Todavía no hay suficiente historial para ver qué se repite.",
        { falta: `captura al menos ${MINIMO_CARGOS} cargos del mismo lugar` }),
  };
}

// ═══ motor/tendencia.js ═══
// Tendencia — ¿voy mejorando?
//
// La app contesta muy bien "¿cómo voy hoy?", y no contestaba "¿estoy mejor que hace tres
// meses?". Son preguntas distintas: se puede tener una quincena buena dentro de un año malo.
//
// Y va la cuarta regla de YNAB traída a la quincena mexicana: no "ahorré algo", sino
// "cuántas quincenas puedo vivir con lo que tengo guardado". Ese número es el que de verdad
// dice si alguien está saliendo del hoyo o solo tuvo una semana tranquila.






const MESES_ABREVIADOS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

/** "sep 1", "sep 2" — la etiqueta del ciclo sola se repite cada mes y no sirve para una gráfica. */
function etiquetaCorta(ciclo) {
  return `${MESES_ABREVIADOS[Number(ciclo.inicio.slice(5, 7)) - 1]} ${ciclo.indice + 1}`;
}

/** Cuántos ciclos completos hacen falta antes de hablar de tendencia. Menos es ruido. */
const CICLOS_MINIMOS = 4;

/** Los últimos n ciclos, del más viejo al más nuevo. */
function ciclosRecientes(datos, iso = hoyISO(), n = 6) {
  const cortes = datos.perfil.cortes;
  const lista = [];
  let cursor = iso;
  for (let i = 0; i < n; i++) {
    const ciclo = cicloDe(cursor, cortes);
    lista.unshift(ciclo);
    cursor = sumarDias(ciclo.inicio, -1);
  }
  return lista;
}

/**
 * Cuánto entró, cuánto salió y cuánto sobró en cada uno de los últimos ciclos.
 * El ciclo en curso viene marcado `completo: false`: compararlo de tú a tú con los cerrados
 * haría ver una caída donde solo hay días que todavía no pasan.
 */
function tendenciaPorCiclo(datos, iso = hoyISO(), n = 6) {
  return ciclosRecientes(datos, iso, n).map((ciclo) => {
    const movimientos = movimientosEntre(datos, ciclo.inicio, ciclo.fin);
    const ingresos = suma(movimientos, (m) => m.tipo === TIPOS.INGRESO);
    const gastos = suma(movimientos, (m) => m.tipo === TIPOS.GASTO);
    const ahorrado = suma(movimientos, (m) => m.tipo === TIPOS.AHORRO) - suma(movimientos, (m) => m.tipo === TIPOS.RETIRO);
    return {
      etiqueta: ciclo.etiqueta,
      corta: etiquetaCorta(ciclo),
      inicio: ciclo.inicio,
      fin: ciclo.fin,
      ingresos,
      gastos,
      ahorrado,
      saldo: ingresos - gastos,
      completo: comparar(ciclo.fin, iso) < 0,
      hayDatos: movimientos.length > 0,
    };
  });
}

/**
 * ¿Va mejorando? Compara la primera mitad de los ciclos cerrados con la segunda.
 * Con pocos datos NO adivina: dice cuántos ciclos faltan para poder contestar.
 */
function resumenTendencia(datos, iso = hoyISO(), n = 6) {
  const puntos = tendenciaPorCiclo(datos, iso, n);
  const cerrados = puntos.filter((p) => p.completo && p.hayDatos);

  if (cerrados.length < CICLOS_MINIMOS) {
    return {
      puntos,
      cambio: null,
      veredicto: sinDatos(
        `Llevas ${cerrados.length} ${cerrados.length === 1 ? "quincena" : "quincenas"} con datos; con ${CICLOS_MINIMOS} ya se puede ver si mejoras.`,
        "sigue capturando: la tendencia aparece sola",
      ),
    };
  }

  const mitad = Math.floor(cerrados.length / 2);
  const promedio = (lista) => Math.round(lista.reduce((t, p) => t + p.saldo, 0) / lista.length);
  const antes = promedio(cerrados.slice(0, mitad));
  const ahora = promedio(cerrados.slice(mitad));
  const cambio = ahora - antes;

  const mejora = cambio > 0;
  return {
    puntos,
    cambio,
    antes,
    ahora,
    veredicto: veredicto(
      mejora ? ESTADOS.VA_BIEN : ESTADOS.AJUSTADO,
      mejora ? SEVERIDADES.OK : SEVERIDADES.MEDIA,
      mejora
        ? `Te está sobrando ${formatear(cambio)} más por quincena que antes.`
        : `Te está sobrando ${formatear(Math.abs(cambio))} menos por quincena que antes.`,
      { antes, ahora, cambio, ciclos: cerrados.length },
    ),
  };
}

/**
 * Cuántas quincenas podrías vivir con lo guardado, si mañana dejaras de cobrar.
 * Es la cuarta regla de YNAB —"envejece tu dinero"— en la moneda de esta app. Se mide contra
 * lo que de verdad gastas, no contra lo que crees que gastas.
 */
function quincenasDeColchon(datos, iso = hoyISO(), n = 6) {
  const guardado = ahorroLibre(datos);
  const cerrados = tendenciaPorCiclo(datos, iso, n).filter((p) => p.completo && p.hayDatos);

  if (!cerrados.length) {
    return {
      quincenas: null,
      guardado,
      gastoTipico: null,
      veredicto: sinDatos(
        "Todavía no sé cuánto gastas en una quincena normal, así que no puedo decir cuánto te duraría lo guardado.",
        "captura una quincena completa de gastos",
      ),
    };
  }

  const gastoTipico = Math.round(cerrados.reduce((t, p) => t + p.gastos, 0) / cerrados.length);
  if (gastoTipico <= 0) {
    return { quincenas: null, guardado, gastoTipico, veredicto: sinDatos("No hay gastos registrados con qué comparar.", "captura tus gastos de una quincena") };
  }

  const quincenas = guardado / gastoTipico;
  const redondo = Math.round(quincenas * 10) / 10;

  return {
    quincenas: redondo,
    guardado,
    gastoTipico,
    veredicto: veredicto(
      quincenas >= 4 ? ESTADOS.VA_BIEN : quincenas >= 1 ? ESTADOS.AJUSTADO : ESTADOS.NO_ALCANZA,
      quincenas >= 4 ? SEVERIDADES.OK : quincenas >= 1 ? SEVERIDADES.MEDIA : SEVERIDADES.ALTA,
      quincenas >= 1
        ? `Con lo guardado vivirías ${redondo} ${redondo === 1 ? "quincena" : "quincenas"} sin cobrar.`
        : `Lo guardado no cubre ni una quincena: gastas ${formatear(gastoTipico)} y tienes ${formatear(guardado)}.`,
      { quincenas: redondo, guardado, gastoTipico },
    ),
  };
}

// ═══ motor/bandeja.js ═══
// La bandeja — lo que llegó solo, esperando que tú digas que sí.
//
// Es la pieza que hace útil todo lo demás, y la regla que la gobierna es una sola:
// NADA de aquí cuenta en ningún número hasta que la persona lo acepta. Un aviso mal leído
// puede equivocarse; lo que no puede es equivocarse en silencio dentro de tus cuentas.
//
// Al aceptar, la app aprende. Esa es la mitad que convierte la bandeja de un trámite diario
// en algo que se hace cada vez más corto.






/**
 * Lee un aviso y lo deja en la bandeja. Devuelve `{ datos, entrada, duplicado, error }`.
 * Si es exactamente el mismo aviso que ya está esperando, NO lo agrega: devuelve el aviso de
 * duplicado. Dos correos por una compra es lo normal, no la excepción.
 */
function recibirAviso(datos, texto, remitente = "", origen = ORIGENES.PEGADO, iso = hoyISO()) {
  const lectura = interpretar(texto, remitente, iso);
  if (!lectura.movimiento) {
    // Pegado a mano, la persona está viendo la pantalla: el error se le enseña al instante y
    // meterlo a la bandeja sería ruido. Lo que llega SOLO es otra cosa. Hasta hoy se contaba
    // como "ilegible" y se tiraba, y con ocho de once bancos cuyo formato nadie ha visto —y
    // plantillas que cambian sin avisar—, ahí desaparecía dinero real sin dejar rastro.
    if (origen === ORIGENES.PEGADO) {
      return { datos, entrada: null, duplicado: null, error: lectura.veredicto };
    }

    const entrada = normalizarEntrada({
      recibido: iso,
      estado: ESTADOS_BANDEJA.ILEGIBLE,
      movimiento: null,
      banco: lectura.banco,
      origen,
      aviso: lectura.veredicto.motivo,
      falta: lectura.veredicto.datos && lectura.veredicto.datos.falta
        ? [lectura.veredicto.datos.falta]
        : ["cuánto"],
      resumen: primeraLinea(texto),
    });
    return {
      datos: { ...datos, bandeja: [entrada, ...(datos.bandeja || [])] },
      entrada,
      duplicado: null,
      error: lectura.veredicto,
    };
  }

  const duplicado = posibleDuplicado(datos, lectura);
  if (duplicado && duplicado.datos.motivo === "huella") {
    return { datos, entrada: null, duplicado, error: null };
  }

  const sugerida = lectura.movimiento.tipo === TIPOS.GASTO ? sugerirCategoria(datos, lectura.comercio) : null;
  const razones = lectura.veredicto.datos.razones || [];
  const entrada = normalizarEntrada({
    recibido: iso,
    estado: ESTADOS_BANDEJA.PENDIENTE,
    movimiento: { ...lectura.movimiento, categoria: sugerida ? sugerida.categoriaId : lectura.movimiento.categoria },
    huella: lectura.huella,
    confianza: lectura.confianza,
    banco: lectura.banco,
    comercio: lectura.comercio,
    ultimos4: lectura.ultimos4,
    origen,
    posibleTraspaso: lectura.posibleTraspaso,
    // Un cargo final NO es un gasto nuevo: sustituye a la preautorización que ya está.
    reemplaza: duplicado && duplicado.datos.motivo === "liquidacion" ? duplicado.datos.id : null,
    aviso: [duplicado ? duplicado.motivo : "", ...razones].filter(Boolean).join(" "),
  });

  return { datos: { ...datos, bandeja: [entrada, ...(datos.bandeja || [])] }, entrada, duplicado, error: null };
}

/**
 * La primera línea con algo escrito, para poder reconocer el aviso en la lista.
 *
 * La primera línea Y NADA MÁS. Cuando el aviso viene del puente, esa línea es el asunto del
 * correo — "Notificación de compra" y el nombre del banco—, que alcanza para saber cuál es sin
 * guardar el cuerpo. La promesa de este motor no cambia: el correo se lee y se tira.
 */
function primeraLinea(texto) {
  const linea = limpiarAviso(texto).split("\n").map((l) => l.trim()).find(Boolean) || "";
  return linea.slice(0, 120);
}

/** Las que llegaron y no se pudieron leer: esperan que digas cuánto y dónde. */
function ilegibles(datos) {
  return (datos.bandeja || [])
    .filter((e) => e.estado === ESTADOS_BANDEJA.ILEGIBLE)
    .sort((a, b) => comparar(b.recibido, a.recibido) || (a.id < b.id ? 1 : -1));
}

function entradaPorId(datos, id) {
  return (datos.bandeja || []).find((e) => e.id === id) || null;
}

/** Lo que espera respuesta, lo más reciente arriba. */
function pendientes(datos) {
  return (datos.bandeja || [])
    .filter((e) => e.estado === ESTADOS_BANDEJA.PENDIENTE)
    .sort((a, b) => comparar(b.recibido, a.recibido) || (a.id < b.id ? 1 : -1));
}

/** Para el contador de la barra y para saber si hay algo que hacer hoy. */
function resumenBandeja(datos) {
  const espera = pendientes(datos);
  return {
    pendientes: espera.length,
    dudosos: espera.filter((e) => e.confianza !== "alta").length,
    ilegibles: ilegibles(datos).length,
    total: (datos.bandeja || []).length,
  };
}

/**
 * Acepta una entrada: crea el movimiento de verdad y aprende de lo que se corrigió.
 * `cambios` es lo que la persona editó antes de aceptar (categoría, monto, tipo, fecha, nota).
 */
function aceptarEntrada(datos, id, cambios = {}, iso = hoyISO()) {
  const entrada = entradaPorId(datos, id);
  if (!entrada) return { datos, movimiento: null, error: "Esa entrada ya no está en la bandeja." };
  if (!esperaRespuesta(entrada)) {
    return { datos, movimiento: null, error: "Esa entrada ya estaba resuelta." };
  }

  const { reemplazar, ...camposCambiados } = cambios;
  // Aceptar reemplazando quita antes la preautorización: si no, el mismo consumo quedaría
  // contado dos veces y la app mentiría hacia arriba, que es la peor dirección.
  const partida = reemplazar && entrada.reemplaza ? eliminarMovimiento(datos, entrada.reemplaza) : datos;

  // Una entrada ILEGIBLE no trae movimiento: lo pone la persona. Se le da la fecha en que
  // llegó el aviso como punto de partida, que es lo más cercano a la verdad que se sabe.
  const base = entrada.movimiento || { fecha: entrada.recibido, tipo: TIPOS.GASTO, categoria: "otros" };
  const propuesto = { ...base, ...camposCambiados };
  const { datos: conMovimiento, movimiento, error } = agregarMovimiento(partida, propuesto);
  if (error) return { datos, movimiento: null, error };

  // Aprender solo tiene sentido si sabemos de qué comercio hablamos y a dónde lo mandó. En una
  // entrada ilegible el comercio no salió del correo: lo escribió la persona, y ése es
  // justamente el que hay que aprender — así el siguiente aviso del mismo lugar ya llega con
  // su categoría aunque el formato del banco siga sin entenderse.
  const paraAprender = entrada.comercio || movimiento.nota;
  const aprendido = paraAprender && movimiento.tipo === TIPOS.GASTO && movimiento.categoria
    ? recordar(conMovimiento, paraAprender, movimiento.categoria, iso)
    : conMovimiento;

  return {
    datos: {
      ...aprendido,
      bandeja: aprendido.bandeja.map((e) =>
        e.id === id ? { ...e, estado: ESTADOS_BANDEJA.ACEPTADO, movimientoId: movimiento.id } : e),
      // La lápida del reemplazado viaja en `partida`; conservarla evita que el otro
      // dispositivo lo resucite en la siguiente sincronización.
    },
    movimiento,
    error: null,
  };
}

/** Descartar: ni se registra ni se vuelve a preguntar. Sirve para traspasos y para errores. */
function descartarEntrada(datos, id) {
  return {
    ...datos,
    bandeja: (datos.bandeja || []).map((e) =>
      e.id === id && esperaRespuesta(e)
        ? { ...e, estado: ESTADOS_BANDEJA.DESCARTADO }
        : e),
  };
}

/** Deshacer una aceptación: borra el movimiento que creó y la deja esperando otra vez. */
function deshacerEntrada(datos, id) {
  const entrada = entradaPorId(datos, id);
  if (!entrada || entrada.estado !== ESTADOS_BANDEJA.ACEPTADO) return datos;

  const sinMovimiento = entrada.movimientoId ? eliminarMovimiento(datos, entrada.movimientoId) : datos;
  return {
    ...sinMovimiento,
    bandeja: sinMovimiento.bandeja.map((e) =>
      e.id === id ? { ...e, estado: ESTADOS_BANDEJA.PENDIENTE, movimientoId: null } : e),
  };
}

/**
 * Tira lo ya resuelto que es viejo. La bandeja es un buzón, no un archivo: sin esto crecería
 * para siempre y el respaldo se volvería pesado sin darle nada a nadie. Lo pendiente NUNCA
 * se tira, por viejo que sea.
 */
function purgarBandeja(datos, antesDe) {
  return {
    ...datos,
    bandeja: (datos.bandeja || []).filter(
      (e) => esperaRespuesta(e) || comparar(e.recibido, antesDe) >= 0),
  };
}

/** Cuánto suma lo que está esperando: el "si aceptas todo, esto cambia". */
function impactoPendiente(datos) {
  const espera = pendientes(datos);
  const gasto = espera.filter((e) => e.movimiento.tipo === TIPOS.GASTO)
    .reduce((t, e) => t + e.movimiento.monto, 0);
  const ingreso = espera.filter((e) => e.movimiento.tipo === TIPOS.INGRESO)
    .reduce((t, e) => t + e.movimiento.monto, 0);

  return {
    gasto,
    ingreso,
    veredicto: espera.length
      ? veredicto(ESTADOS.AJUSTADO, SEVERIDADES.INFO,
        `${espera.length} ${espera.length === 1 ? "movimiento espera" : "movimientos esperan"} tu confirmación.`,
        { pendientes: espera.length, gasto, ingreso })
      : veredicto(ESTADOS.VA_BIEN, SEVERIDADES.OK, "No hay nada esperando.", { pendientes: 0 }),
  };
}

/**
 * Acepta varias entradas de un jalón, con UN solo guardado.
 *
 * Ésta es la pieza que decide si la app sirve para alguien sin tiempo. Con el puente trayendo
 * correos, son ~40 avisos por quincena, y a un toque cada uno eso es exactamente el mecanismo
 * que la investigación señala como la causa número uno de que la gente abandone estas apps
 * antes de los 30 días. En lote son tres.
 *
 * La regla de la casa NO cambia: sigue aceptando la persona, viendo antes lo que acepta. Lo
 * que cambia es que decir que sí a doce cosas cueste un toque en vez de doce.
 *
 * Si alguna no se puede aceptar, se queda esperando y las demás pasan: un fallo suelto no
 * puede tumbar la tanda ni dejarla a medias sin decirlo.
 */
function aceptarTanda(datos, ids, iso = hoyISO()) {
  let actual = datos;
  const aceptados = [];
  const fallaron = [];

  for (const id of ids || []) {
    const paso = aceptarEntrada(actual, id, {}, iso);
    if (paso.error || !paso.movimiento) {
      fallaron.push(id);
      continue;
    }
    actual = paso.datos;
    aceptados.push(id);
  }

  return { datos: actual, aceptados, fallaron };
}

/** Deshace una tanda entera. Es lo que hace que aceptar de golpe no dé miedo. */
function deshacerTanda(datos, ids) {
  return (ids || []).reduce((acumulado, id) => deshacerEntrada(acumulado, id), datos);
}

/** Las que se pueden aceptar sin mirarlas una por una: no quedó nada que revisar en ellas. */
function deConfianzaAlta(datos) {
  return pendientes(datos).filter((e) => e.confianza === "alta" && !e.reemplaza);
}

// ── Traer del correo ───────────────────────────────────────────────────────
//
// Estas dos viven aquí, y no en la interfaz, por la misma razón de siempre: son cálculo puro
// y aquí se pueden probar sin navegador. Además el botón «Traer ahora» y la traída automática
// tienen que recorrer EXACTAMENTE el mismo camino; si cada uno tuviera el suyo, uno de los
// dos se quedaría atrás el día que cambie algo.

/** Cuántos días pedirle al puente cuando no hay de dónde calcularlo. */
const DIAS_POR_DEFECTO = 3;

/**
 * Cuántos días de correo pedir, para no perder nada por haber estado fuera.
 *
 * Pedir 3 fijos está bien para un botón que aprietas hoy; para algo que corre solo no, porque
 * volver de una semana de vacaciones dejaría cuatro días de avisos afuera y nadie se enteraría.
 * Se cubre el hueco desde la última traída, más un día de traslape —un aviso que llegó anoche,
 * después de la última vez, tiene que caer dentro—, y con un tope: pedirle a Gmail seis meses
 * no trae seis meses, trae un tiempo de espera.
 *
 * Los repetidos no cuestan nada: `recibirAviso` los reconoce y no los mete dos veces.
 */
function ventanaDeAvisos(ultima, hoy = hoyISO(), tope = 30) {
  if (!ultima) return DIAS_POR_DEFECTO;
  const dias = diasEntre(ultima, hoy);
  if (!Number.isFinite(dias) || dias < 0) return DIAS_POR_DEFECTO;
  return Math.min(Math.max(dias + 1, DIAS_POR_DEFECTO), tope);
}

/** Cada cuántas horas, como mucho, vale la pena volver a preguntarle al correo. */
const HORAS_ENTRE_TRAIDAS = 3;

/**
 * ¿Toca ir por correo, o se preguntó hace un rato?
 *
 * Va en milisegundos y no en días porque lo que evita es otra cosa: en un celular la app se
 * queda abierta y se vuelve a mirar veinte veces al día. Sin este freno, cada vez que vuelves
 * a la pestaña saldría una petición a Apps Script, que además tiene cuota diaria.
 */
function tocaTraer(selloUltima, ahora = Date.now(), horas = HORAS_ENTRE_TRAIDAS) {
  if (!selloUltima) return true; // nunca se ha traído: adelante
  const transcurrido = ahora - selloUltima;
  if (!Number.isFinite(transcurrido)) return true;
  // Un reloj que va atrasado dejaría la traída congelada hasta que se emparejara. Mejor ir.
  if (transcurrido < 0) return true;
  return transcurrido >= horas * 3600000;
}

/**
 * Mete a la bandeja todo lo que trajo el puente. Devuelve datos nuevos; no muta lo recibido.
 *
 * Se recorre entero y se guarda UNA vez del lado de quien llama: un guardado por correo
 * dejaría la pantalla parpadeando y multiplicaría las escrituras por nada.
 */
function absorberAvisos(datos, avisos, iso = hoyISO()) {
  let acumulado = datos;
  let nuevos = 0, repetidos = 0, sinLeer = 0;

  for (const aviso of avisos || []) {
    const texto = [aviso.asunto, aviso.texto].filter(Boolean).join("\n");
    const paso = recibirAviso(acumulado, texto, aviso.remitente || "", ORIGENES.CORREO, iso);

    // Lo que importa es si hubo ENTRADA, no si hubo error. Un aviso que no se pudo leer deja
    // entrada igual, esperando que digas cuánto y dónde; tirarlo aquí sería tirar el gasto.
    if (!paso.entrada) {
      repetidos++;
      continue;
    }
    acumulado = paso.datos;
    if (paso.entrada.estado === ESTADOS_BANDEJA.ILEGIBLE) sinLeer++;
    else nuevos++;
  }

  return { datos: acumulado, nuevos, repetidos, sinLeer };
}

// ═══ almacen/archivo.js ═══
// Respaldo — el puente para que estos datos nunca queden atrapados en ninguna app.
//
// Lo que exporta es el documento completo, tal cual, en JSON legible. Es el mismo formato
// que come el importador. Si mañana esta app deja de existir, los datos salen enteros.




function exportar(datos) {
  return JSON.stringify({ ...datos, exportado: new Date().toISOString(), version: VERSION_DATOS }, null, 2);
}

function nombreDeRespaldo(iso = hoyISO()) {
  return `finanzas-${iso}.json`;
}

/**
 * Lee un respaldo. Nunca lanza: devuelve el motivo para poder enseñarlo en pantalla.
 * Un respaldo de una versión más nueva se RECHAZA en vez de abrirse a medias.
 */
function importar(texto) {
  let crudo;
  try {
    crudo = JSON.parse(texto);
  } catch (e) {
    return { ok: false, motivo: "El archivo no es un JSON válido.", datos: null };
  }
  return migrar(crudo);
}

/**
 * Cada cuántos días tiene sentido volver a bajar un respaldo. Ni tan seguido que se vuelva
 * ruido que se aprende a ignorar, ni tan lejos que una limpieza del navegador duela.
 */
const DIAS_ENTRE_RESPALDOS = 30;

/** Debajo de esto no se molesta a nadie: todavía no hay gran cosa que perder. */
const MINIMO_PARA_INSISTIR = 10;

/**
 * ¿Toca recordarle bajar un respaldo? Devuelve `null` cuando no, y si sí, con qué números.
 *
 * Es la lección de Mint, que cerró con 25 millones de usuarios encima: lo que salva tu
 * historia no es que la app tenga exportador, es haberlo USADO. Grip lo tiene desde el
 * principio y nunca lo mencionaba, así que servía de nada.
 *
 * No bloquea, no regaña y no aparece si no hay nada nuevo que perder.
 */
function respaldoPendiente(datos, iso = hoyISO()) {
  const movimientos = Object.values((datos && datos.movimientos) || {}).flat();
  if (!movimientos.length) return null; // sin nada capturado, no hay nada que salvar

  const ultimo = datos.ultimoRespaldo || null;

  if (!ultimo) {
    // Nunca ha bajado uno. Se espera a que haya algo que de verdad duela perder.
    return movimientos.length >= MINIMO_PARA_INSISTIR
      ? { nunca: true, dias: null, movimientos: movimientos.length }
      : null;
  }

  const dias = diasEntre(ultimo.slice(0, 10), iso);
  if (dias < DIAS_ENTRE_RESPALDOS) return null;

  // Y si desde el último respaldo no capturó nada, tampoco hay por qué molestarlo.
  const nuevos = movimientos.filter((m) => comparar(m.fecha, ultimo.slice(0, 10)) > 0).length;
  return nuevos > 0 ? { nunca: false, dias, movimientos: nuevos } : null;
}

// ═══ almacen/local.js ═══
// Almacén local — la base sobre la que corre todo, en el propio navegador.
//
// IndexedDB primero (aguanta años de movimientos y sobrevive a recargas), localStorage si
// no está disponible, y memoria como último recurso. El nivel que se logró se DECLARA:
// una app que guarda en memoria y no lo dice es una app que te va a perder los datos.
//
// Y hay DOS preguntas distintas que antes se respondían con un solo `true`:
//   `duradero`   — ¿sobrevive a cerrar la pestaña?  (sí en IndexedDB y localStorage)
//   `persistente`— ¿el navegador se comprometió a no borrarlo si anda corto de espacio?
// La segunda hay que PEDIRLA y puede negarse. Decir que sí sin haberla pedido —que es lo que
// hacía este archivo— es la clase de mentira que se cobra el día que el sistema hace limpieza.
//
// Cuidado con las guardas: en un origen aislado (un iframe sin `allow-same-origin`, o un
// navegador con los datos de sitio bloqueados) **hasta leer** `window.localStorage` lanza
// SecurityError. Por eso aquí no se pregunta con `typeof`: se intenta de verdad, dentro de
// un try, y si truena se baja al siguiente nivel. Este archivo no puede lanzar nunca.

const BASE = "finanzas";
const ALMACEN = "documento";
const LLAVE = "raiz";

/** Lee una global sin que el acceso pueda tumbar la app. Devuelve null si ni mirarla se puede. */
function leerGlobal(nombre) {
  try {
    return globalThis[nombre] || null;
  } catch (e) {
    return null;
  }
}

/**
 * Le pide al navegador que NO borre estos datos cuando ande corto de espacio.
 *
 * Sin esto, lo guardado es "mejor esfuerzo": Safari borra todo el almacenamiento de scripts a
 * los 7 días sin interacción, y Chrome desaloja primero los orígenes que no lo pidieron. Una
 * app de finanzas que pierde el historial no es una app de finanzas.
 *
 * Devuelve lo que el navegador CONCEDIÓ, no lo que se pidió: si dice que no, hay que decirlo
 * en pantalla en vez de suponer que sí. Nunca lanza y nunca se queda colgada.
 */
async function pedirPersistencia() {
  const almacenamiento = leerGlobal("navigator") && leerGlobal("navigator").storage;
  if (!almacenamiento || typeof almacenamiento.persist !== "function") return false;
  try {
    // Si ya estaba concedida, no se vuelve a pedir: en Firefox eso le sale al usuario como
    // una pregunta, y preguntar dos veces por lo mismo es una forma de gastarle el permiso.
    if (typeof almacenamiento.persisted === "function" && (await almacenamiento.persisted())) return true;
    return (await Promise.race([
      almacenamiento.persist(),
      new Promise((r) => setTimeout(() => r(false), 3000)),
    ])) === true;
  } catch (e) {
    return false;
  }
}

function abrirIndexedDB() {
  return new Promise((resolver) => {
    const idb = leerGlobal("indexedDB");
    if (!idb) return resolver(null);

    let peticion;
    try {
      peticion = idb.open(BASE, 1);
    } catch (e) {
      return resolver(null);
    }

    // Si la base no responde (permisos, versión trabada), no se espera para siempre.
    const rendirse = setTimeout(() => resolver(null), 3000);
    const terminar = (valor) => {
      clearTimeout(rendirse);
      resolver(valor);
    };

    peticion.onupgradeneeded = () => {
      const bd = peticion.result;
      if (!bd.objectStoreNames.contains(ALMACEN)) bd.createObjectStore(ALMACEN);
    };
    peticion.onsuccess = () => terminar(peticion.result);
    peticion.onerror = () => terminar(null);
    peticion.onblocked = () => terminar(null);
  });
}

function operar(bd, modo, accion) {
  return new Promise((resolver, rechazar) => {
    try {
      const tx = bd.transaction(ALMACEN, modo);
      const peticion = accion(tx.objectStore(ALMACEN));
      peticion.onsuccess = () => resolver(peticion.result);
      peticion.onerror = () => rechazar(peticion.error || new Error("La base local rechazó la operación."));
    } catch (e) {
      rechazar(e);
    }
  });
}

/** localStorage no basta con que exista: tiene que dejar escribir (modo privado, cuotas). */
function localStorageUtilizable() {
  const ls = leerGlobal("localStorage");
  if (!ls) return null;
  try {
    const prueba = `${BASE}:prueba`;
    ls.setItem(prueba, "1");
    ls.removeItem(prueba);
    return ls;
  } catch (e) {
    return null;
  }
}

function enMemoria(motivo) {
  let memoria = null;
  return {
    tipo: "memoria",
    duradero: false,
    persistente: false,
    motivo,
    async cargar() {
      return memoria;
    },
    async guardar(datos) {
      memoria = datos;
    },
    async borrar() {
      memoria = null;
    },
  };
}

/** Devuelve siempre un almacén utilizable. Nunca lanza; en el peor caso, memoria declarada. */
async function abrirLocal() {
  let bd = null;
  try {
    bd = await abrirIndexedDB();
  } catch (e) {
    bd = null;
  }

  if (bd) {
    const persistente = await pedirPersistencia();
    return {
      tipo: "indexeddb",
      duradero: true,
      persistente,
      // `motivo` es para cuando algo se degradó. Que no haya persistencia no degrada nada
      // aquí: es un hecho que la interfaz tiene que contar con sus palabras, no un fallo.
      motivo: null,
      async cargar() {
        try {
          return (await operar(bd, "readonly", (s) => s.get(LLAVE))) || null;
        } catch (e) {
          return null;
        }
      },
      async guardar(datos) {
        await operar(bd, "readwrite", (s) => s.put(datos, LLAVE));
      },
      async borrar() {
        await operar(bd, "readwrite", (s) => s.delete(LLAVE));
      },
    };
  }

  const ls = localStorageUtilizable();
  if (ls) {
    return {
      tipo: "localstorage",
      duradero: true,
      // localStorage es el nivel de abajo: nunca tuvo garantía de permanencia y no se le pide.
      persistente: false,
      motivo: null,
      async cargar() {
        try {
          const texto = ls.getItem(`${BASE}:${LLAVE}`);
          return texto ? JSON.parse(texto) : null;
        } catch (e) {
          return null;
        }
      },
      async guardar(datos) {
        ls.setItem(`${BASE}:${LLAVE}`, JSON.stringify(datos));
      },
      async borrar() {
        ls.removeItem(`${BASE}:${LLAVE}`);
      },
    };
  }

  // Sin almacenamiento del navegador: la app funciona, pero al cerrar se pierde. Se avisa.
  return enMemoria("Este navegador no deja guardar datos: al cerrar la pestaña se pierde lo capturado.");
}

// ═══ almacen/almacen.js ═══
// El almacén — cuatro métodos y varios respaldos detrás.
//
// La interfaz de la app habla SOLO con esto: cargar, guardar, suscribir, estado. Debajo
// puede haber IndexedDB sola, o IndexedDB con un espejo sincronizado. Cambiar de espejo
// mañana (una carpeta local, un servidor propio) es escribir otro adaptador; ni el motor
// ni la interfaz se enteran.
//
// El local SIEMPRE se escribe primero. Si el espejo falla, el dato ya está a salvo y el
// modo baja a "solo este dispositivo" con su motivo: nunca se pierde una captura en
// silencio.






const MODOS = {
  SINCRONIZADO: "sincronizado",
  LOCAL: "local",
  EFIMERO: "efimero",
};

async function abrirAlmacen(opciones = {}) {
  // Abrir el almacén NUNCA falla: en el peor de los casos se trabaja en memoria y se dice.
  let local;
  try {
    local = opciones.local || (await abrirLocal());
  } catch (e) {
    local = enMemoria("No se pudo abrir el almacenamiento de este navegador.");
  }

  // El adaptador de sincronización es opcional: si su archivo no está, esto no falla.
  let espejo = null;
  const proveedor =
    opciones.proveedorSincronizacion ||
    (typeof abrirSincronizacion === "function" ? abrirSincronizacion : null);
  if (proveedor) {
    try {
      espejo = await proveedor();
    } catch (e) {
      espejo = null;
    }
  }

  const estado = {
    modo: espejo ? MODOS.SINCRONIZADO : local.duradero ? MODOS.LOCAL : MODOS.EFIMERO,
    tipoLocal: local.tipo,
    // ¿El navegador se comprometió a no borrar esto si anda corto de espacio? Es distinto de
    // `duradero` (sobrevivir a cerrar la pestaña) y la interfaz tiene que poder decirlo.
    persistente: local.persistente === true,
    motivo: local.motivo || null,
    // Se enciende cuando se leyeron datos que este código no sabe abrir (versión más
    // nueva). Mientras esté encendido NO se escribe: escribir sería borrarlos.
    bloqueado: false,
    aviso: null,
  };

  function degradar(motivo) {
    estado.modo = local.duradero ? MODOS.LOCAL : MODOS.EFIMERO;
    estado.motivo = motivo;
  }

  return {
    estado: () => ({ ...estado }),

    async cargar() {
      const crudoLocal = await local.cargar();
      let crudoEspejo = null;

      if (espejo) {
        try {
          crudoEspejo = await espejo.cargar();
        } catch (e) {
          degradar("No se pudo leer la copia sincronizada; se abrió la de este dispositivo.");
        }
      }

      if (!crudoLocal && !crudoEspejo) return { datos: datosVacios(hoyISO()), nuevo: true, aviso: null };

      // Cada lado se sube a la versión de hoy ANTES de unirlos. Fusionar un documento v2 con
      // uno v3 mezclaría dos formas distintas de los mismos datos, que es peor que no unir.
      const ladoLocal = crudoLocal ? migrar(crudoLocal) : null;
      const ladoEspejo = crudoEspejo ? migrar(crudoEspejo) : null;

      // Si CUALQUIERA de los dos no se sabe abrir, no se toca nada: ni se abre a medias ni se
      // borra. Se conserva, se explica y se traba la escritura.
      const fallo = [ladoLocal, ladoEspejo].find((lado) => lado && !lado.ok);
      if (fallo) {
        estado.bloqueado = true;
        estado.motivo = fallo.motivo;
        return { datos: datosVacios(hoyISO()), nuevo: true, aviso: fallo.motivo, bloqueado: true };
      }
      estado.bloqueado = false;

      const datosLocal = ladoLocal ? ladoLocal.datos : null;
      const datosEspejo = ladoEspejo ? ladoEspejo.datos : null;

      // Y aquí lo importante: se UNEN. Antes ganaba un documento entero por su fecha y el otro
      // se descartaba completo — lo capturado en el aparato que sincronizó primero desaparecía
      // sin avisar. Ahora no se pierde nada que alguien no haya borrado a propósito.
      const unido = normalizar(fusionar(datosLocal, datosEspejo));

      // El que iba atrás se pone al día. `difieren` evita reescribir cuando ya decían lo mismo.
      if (difieren(unido, datosLocal)) await local.guardar(unido);
      if (espejo && difieren(unido, datosEspejo)) {
        try {
          await espejo.guardar(unido);
        } catch (e) {
