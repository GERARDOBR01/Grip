<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 135 900 900" width="360" height="360">
  <title>Sticker animado</title>
  <style>
    .ojo { animation: parpadear 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .lengua { animation: lengua 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
    @keyframes parpadear { 0%,20%,26%,100% { transform: scaleY(1); } 23% { transform: scaleY(.08); } }
    @keyframes lengua {
      0%,40% { transform: scaleY(0); }
      52%,82% { transform: scaleY(1); }
      62% { transform: scaleY(.9) rotate(-3deg); }
      72% { transform: scaleY(1) rotate(3deg); }
      94%,100% { transform: scaleY(0); }
    }
  </style>
  <defs>
    <clipPath id="marco"><rect x="136" y="162" width="848" height="846" rx="14"/></clipPath>
  </defs>

  <!-- marco blanco del sticker -->
  <rect x="124" y="150" width="872" height="870" rx="22" fill="#fff"/>
  <g clip-path="url(#marco)">
    <rect x="130" y="150" width="870" height="870" fill="#3b4760"/>

    <!-- boca del vecino, abajo a la derecha -->
    <ellipse cx="1000" cy="900" rx="110" ry="170" fill="#141414"/>
    <ellipse cx="1010" cy="960" rx="80" ry="80" fill="#f07a8c"/>

    <g>
      <!-- la boca oscura detrás de los dientes -->
      <ellipse cx="630" cy="905" rx="150" ry="62" fill="#141414"/>
      <path class="lengua" d="M585,915 C585,1000 610,1015 640,1015 C670,1015 695,1000 695,915 Z"
            fill="#f07a8c" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
      <g>
        <path d="M470,850 L600,862 L640,812 L690,830 L702,796 L772,798 L762,880 Q650,935 520,925 Z"
              fill="#fbfbf5" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
        <path d="M600,862 L610,925 M690,830 L700,910" stroke="#1a1a1a" stroke-width="5"/>
        <path d="M560,900 Q600,940 640,905" fill="#fbfbf5" stroke="#1a1a1a" stroke-width="5"/>
      </g>

      <!-- cabeza -->
      <path d="M80,100 L905,100 Q925,380 935,655 L905,668 L896,700 L830,745 L782,758 L772,800 L702,798
               L690,832 L640,815 L600,862 L480,852 L430,836 L380,836 L330,820 L252,822 L240,800 L80,745 Z"
            fill="#dcbc8c" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>
      <!-- pliegues -->
      <path d="M230,530 L780,165 M215,550 L565,885" stroke="#2a1d10" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M140,515 L175,522" stroke="#2a1d10" stroke-width="6" stroke-linecap="round"/>
      <path d="M185,675 L275,740 M228,740 L262,765 M238,722 L270,748" stroke="#2a1d10" stroke-width="5" stroke-linecap="round"/>

      <!-- cachetes rosas -->
      <ellipse cx="412" cy="862" rx="44" ry="28" fill="#f2a08e" stroke="#1a1a1a" stroke-width="6"/>
      <ellipse cx="858" cy="738" rx="40" ry="28" fill="#f2a08e" stroke="#1a1a1a" stroke-width="6"/>

      <!-- ojo grande -->
      <g class="ojo">
        <circle cx="582" cy="642" r="124" fill="#7fc3ec" stroke="#1a1a1a" stroke-width="8"/>
        <circle cx="574" cy="616" r="104" fill="#111"/>
        <ellipse cx="552" cy="580" rx="54" ry="36" fill="#fff"/>
        <circle cx="620" cy="660" r="10" fill="#fff" opacity=".8"/>
      </g>
      <!-- ojo chico -->
      <g class="ojo">
        <circle cx="812" cy="520" r="104" fill="#7fc3ec" stroke="#1a1a1a" stroke-width="8"/>
        <circle cx="806" cy="498" r="87" fill="#111"/>
        <ellipse cx="786" cy="466" rx="46" ry="30" fill="#fff"/>
        <circle cx="846" cy="532" r="8" fill="#fff" opacity=".8"/>
      </g>
    </g>

  </g>
</svg>
